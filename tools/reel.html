<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080" />
  <title>Case-study reel</title>
  <!-- A 1080 × 1350 (4:5) case-study video for LinkedIn and link previews, recorded by
       tools/record-reels.mjs. The project's device (the site's own 3D models) is drawn as a blueprint,
       powers on into the working demo, the demo plays its guided tour under callouts, and the neon
       sign closes. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Outfit:wght@200;300;800&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; overflow: hidden; }
    body { position: relative; color: #fff; font-family: "Outfit", sans-serif; background: #8f949c; -webkit-font-smoothing: antialiased; }
    .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
    /* three grounds, cross-faded: the drafting sheet, the project's own colour once powered, the night for the sign */
    .ground { position: absolute; inset: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
    .ground::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 45px 45px; }
    .sheet { background: #8f949c; --grid: rgba(255, 255, 255, 0.1); }
    .live { opacity: 0; --grid: rgba(255, 255, 255, 0.045); background: radial-gradient(62% 46% at 50% 58%, color-mix(in srgb, var(--glow) 42%, var(--c1)), var(--c0) 78%); }
    .night { opacity: 0; --grid: rgba(255, 255, 255, 0.035); background: radial-gradient(48% 30% at 50% 40%, rgba(70, 140, 255, 0.28), transparent 72%), #0b0d13; }
    body.powered .live { opacity: 1; }
    body.closing .night { opacity: 1; }
    canvas { position: absolute; inset: 0; width: 1080px; height: 1350px; }
    body.closing canvas { filter: drop-shadow(0 0 10px #a6d8ff) drop-shadow(0 0 34px #3d8bff); }
    svg.ink { position: absolute; inset: 0; overflow: visible; }
    svg.ink path, svg.ink polyline { fill: none; stroke: #fff; stroke-width: 2; }
    .screens { position: absolute; inset: 0; pointer-events: none; }
    .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; opacity: 0; }
    .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
    .screen .notch { position: absolute; left: 50%; top: 0; width: 178px; height: 32px; margin-left: -89px; border-radius: 0 0 13px 13px; background: #000; }
    /* power-on: a band of light runs down the glass as the app appears */
    .screen .scan { position: absolute; left: 0; right: 0; top: -30%; height: 30%; background: linear-gradient(transparent, rgba(255, 255, 255, 0.55), transparent); opacity: 0; }
    .screen.on { opacity: 1; transition: opacity 0.9s ease-out; }
    .screen.on .scan { animation: scan 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes scan { 0% { top: -30%; opacity: 1; } 100% { top: 100%; opacity: 0; } }
    /* drawing sheet header and title block */
    header { position: absolute; left: 72px; top: 64px; right: 72px; display: flex; justify-content: space-between; align-items: flex-start; }
    h1 { font: 800 112px/0.9 "Outfit"; letter-spacing: -0.05em; }
    header .sub { margin-top: 18px; font-size: 19px; }
    header .step { font-size: 19px; text-align: right; line-height: 1.5; white-space: pre; flex: 0 0 auto; }
    /* the drawing's title block, as a strip along the foot of the sheet */
    .titleblock { position: absolute; left: 72px; right: 72px; bottom: 44px; display: grid; grid-template-columns: 1.3fr 1fr 1.3fr 1fr 0.8fr; border: 2px solid #fff; font-size: 13px; transition: opacity 0.6s; }
    .titleblock span { padding: 10px 14px; border-left: 1px solid rgba(255, 255, 255, 0.7); white-space: nowrap; }
    .titleblock span:first-child { border-left: 0; font-size: 15px; }
    .dim { position: absolute; font-size: 17px; transform: translate(-50%, -50%); white-space: nowrap; }
    /* the callout for the current step: a site-style label on a leader line */
    .callout { position: absolute; width: 330px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.35s; }
    .callout.on { opacity: 1; }
    .callout .n { font-size: 18px; }
    .callout .t { font: 800 40px/1.02 "Outfit"; letter-spacing: -0.035em; text-transform: none; text-wrap: balance; }
    .callout.left { text-align: right; }
    /* the close, under the neon sign */
    .close { position: absolute; left: 72px; right: 72px; top: 820px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; opacity: 0; transform: translateY(24px); transition: opacity 0.9s, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1); }
    body.signed .close { opacity: 1; transform: none; }
    .close h2 { font: 800 118px/0.92 "Outfit"; letter-spacing: -0.05em; }
    .close p { font: 300 36px/1.3 "Outfit"; color: #d7e6f5; max-width: 32ch; text-wrap: balance; }
    .close .url { margin-top: 24px; display: inline-flex; align-items: center; height: 84px; padding: 0 38px; background: #fff; color: #0b0d13; font-size: 30px; letter-spacing: 0.04em; text-transform: none; }
    body.closing header, body.closing .titleblock, body.closing .callout { opacity: 0 !important; transition: opacity 0.5s; }
  </style>
</head>
<body>
  <div class="ground sheet"></div>
  <div class="ground live"></div>
  <div class="ground night"></div>
  <canvas id="gl" width="1080" height="1350"></canvas>
  <svg class="ink" id="ink" width="1080" height="1350"></svg>
  <div class="screens" id="screens"></div>
  <header>
    <div><h1 id="name"></h1><p class="sub mono" id="sub"></p></div>
    <p class="step mono" id="step"></p>
  </header>
  <div class="titleblock mono"><span>VCDevelopments</span><span>Drawn + built</span><span>L. Van Cauwenbergh</span><span id="sheetno"></span><span>Scale 1:1</span></div>
  <div id="labels"></div>
  <div class="callout mono" id="callout"><span class="n" id="cn"></span><span class="t" id="ct"></span></div>
  <section class="close"><h2>Need one built?</h2><p>Drawn, built and shipped by one person.</p><span class="url mono">vcdevelopments.info</span></section>
<script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { PROJECTS, slugOf } from '../js/projects.js';
  import { device } from '../js/devices.js';
  import { BOUNDS, neonGeometries, neonWireGeometry, neonMaterial } from '../js/neonLogo.js';

  const W = 1080, H = 1350;
  const slug = new URLSearchParams(location.search).get('p');
  const index = PROJECTS.findIndex((x) => slugOf(x) === slug);
  const p = PROJECTS[index];
  const TAGS = { creatorslots: 'Slot studio', vcdevelopments: '3D portfolio' };
  const root = document.documentElement.style;
  root.setProperty('--c0', p.colors[0]);
  root.setProperty('--c1', p.colors[1]);
  root.setProperty('--glow', p.colors[2]);
  const $ = (id) => document.getElementById(id);
  const two = (n) => String(n).padStart(2, '0');
  $('name').textContent = p.name;
  if (p.name.length > 10) $('name').style.fontSize = '88px'; // long names stay clear of the step label
  $('sub').textContent = `Sheet ${two(index + 1)} / ${two(PROJECTS.length)} · ${TAGS[slug]}`;
  $('sheetno').textContent = `Sheet ${two(index + 1)} of ${two(PROJECTS.length)}`;

  // the site's scrambled-text reveal
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>/';
  function scramble(el, text, ms = 700) {
    const t0 = performance.now(), reveal = [...text].map((_, i) => (i / text.length) * 0.55 * ms + Math.random() * 0.45 * ms);
    cancelAnimationFrame(el._r);
    (function tick(now) {
      const t = now - t0;
      let out = '', done = true;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ' || text[i] === '\n' || t >= reveal[i]) out += text[i];
        else { done = false; out += GLYPHS[(Math.random() * GLYPHS.length) | 0]; }
      }
      el.textContent = out;
      if (!done) el._r = requestAnimationFrame(tick);
    })(t0);
  }

  // ---- the scene: the site's own device models, lit like the site ----
  const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
  renderer.setSize(W, H, false);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6d727b, 1.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(5, 8, 6);
  scene.add(key);
  const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);

  const loader = new THREE.TextureLoader();
  const dev = device(p, (src) => { const t = loader.load(`../${src}`); t.colorSpace = THREE.SRGBColorSpace; return t; });
  dev.proxy.visible = false;
  const rig = new THREE.Group();
  rig.add(dev.group);
  scene.add(rig);
  for (const sc of dev.screens) sc.material.color.setScalar(0); // dark glass until it powers on

  // frame the device in the lower part of the sheet, under the title
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const wide = dev.size.x > dev.size.y; // a laptop with its phone
  const fit = Math.max(dev.size.y / 0.56, dev.size.x / (wide ? 0.7 : 0.78) / camera.aspect);
  const dist = fit / (2 * tanH) + dev.size.z / 2;
  const viewH = 2 * dist * tanH;
  camera.position.set(0, viewH * 0.09, dist);
  camera.lookAt(0, viewH * 0.09, 0);
  rig.position.y = viewH * 0.005;

  // blueprint: every part's edges, traced in white, x-ray style
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false });
  const traces = [], meshes = [];
  dev.group.traverse((o) => {
    if (!o.isMesh || o === dev.proxy) return;
    meshes.push(o);
    if (o.isInstancedMesh) return;
    const l = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 8), lineMat);
    l.renderOrder = 10;
    o.add(l);
    traces.push(l);
  });
  for (const m of meshes) {
    m.material = m.material.clone();
    m.material.transparent = true;
    m.material.opacity = 0;
    m.material.depthWrite = false;
  }
  for (const sc of dev.screens) sc.material = sc.mesh.material;
  traces.forEach((l, i) => { l.userData.n = l.geometry.attributes.position.count; l.userData.at = (i / traces.length) * 0.55; l.geometry.setDrawRange(0, 0); });

  // the close: the site's neon VC, first as wire, then lit
  const sign = new THREE.Group();
  const signMat = neonMaterial({ transparent: true, opacity: 0 });
  for (const g of neonGeometries()) sign.add(new THREE.Mesh(g, signMat));
  const signWire = new THREE.LineSegments(neonWireGeometry(), new THREE.LineBasicMaterial({ color: 0xcfe9ff, transparent: true, opacity: 0.9 }));
  signWire.geometry.setDrawRange(0, 0);
  sign.add(signWire);
  sign.children.forEach((c) => c.position.sub(BOUNDS.center));
  sign.scale.setScalar((viewH * camera.aspect * 0.4) / BOUNDS.W);
  sign.position.set(0, camera.position.y + viewH * 0.21, 0);
  sign.visible = false;
  scene.add(sign);

  // ---- the live screens: each demo, warped onto its 3D screen's corners every frame ----
  const pt = new THREE.Vector3();
  for (const sc of dev.screens) {
    const el = document.createElement('div');
    el.className = 'screen';
    el.style.width = `${sc.px.w}px`;
    el.style.height = `${sc.px.h}px`;
    el.style.borderRadius = sc.radius;
    const f = document.createElement('iframe');
    f.src = `../${sc.demo}${sc.demo.includes('?') ? '&' : '?'}reel`;
    el.append(f, Object.assign(document.createElement('div'), { className: 'scan' }));
    if (sc.notch) el.append(Object.assign(document.createElement('div'), { className: 'notch' }));
    $('screens').append(el);
    const w = sc.width / 2, h = sc.height / 2;
    Object.assign(sc, { el, frame: f, corners: [[-w, h], [w, h], [w, -h], [-w, -h]].map(([x, y]) => new THREE.Vector3(x, y, 0.0005)) });
  }
  const project = (v, m) => { pt.copy(v).applyMatrix4(m).project(camera); return [(pt.x * 0.5 + 0.5) * W, (0.5 - pt.y * 0.5) * H]; };
  // the projective map from a w × h element to a quad (as on the site)
  function homography([[x0, y0], [x1, y1], [x2, y2], [x3, y3]]) {
    const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
    const den = dx1 * dy2 - dx2 * dy1, g = (dx3 * dy2 - dx2 * dy3) / den, k = (dx1 * dy3 - dx3 * dy1) / den;
    return { a: x1 - x0 + g * x1, b: x3 - x0 + k * x3, c: x0, d: y1 - y0 + g * y1, e: y3 - y0 + k * y3, f: y0, g, k };
  }
  const mapUV = (m, u, v) => { const z = m.g * u + m.k * v + 1; return [(m.a * u + m.b * v + m.c) / z, (m.d * u + m.e * v + m.f) / z]; };
  function placeScreens() {
    for (const sc of dev.screens) {
      sc.mesh.updateWorldMatrix(true, false);
      sc.quad = sc.corners.map((c) => project(c, sc.mesh.matrixWorld));
      const m = (sc.map = homography(sc.quad)), { w, h } = sc.px;
      sc.el.style.transform = `matrix3d(${m.a / w},${m.d / w},0,${m.g / w},${m.b / h},${m.e / h},0,${m.k / h},0,0,1,0,${m.c},${m.f},0,1)`;
    }
  }

  // ---- ink: dimension lines while drawing, the callout's leader line during the tour ----
  const ink = $('ink'), labels = $('labels');
  const svgEl = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); ink.append(e); return e; };
  const phoneScreen = dev.screens.find((s) => s.px.w === 393) || dev.screens[0];
  const dims = dev.screens.map((sc) => ({
    sc,
    top: svgEl('path', {}), side: svgEl('path', {}),
    wl: Object.assign(labels.appendChild(document.createElement('span')), { className: 'dim mono' }),
    hl: Object.assign(labels.appendChild(document.createElement('span')), { className: 'dim mono' }),
  }));
  function drawDims(k) {
    for (const d of dims) {
      const [[x0, y0], [x1, y1], [x2, y2]] = d.sc.quad, o = 34, unit = d.sc.px.w === 393 ? 'PT' : 'PX';
      d.top.setAttribute('d', `M${x0},${y0 - o}L${x1},${y1 - o}M${x0},${y0 - o - 10}v20M${x1},${y1 - o - 10}v20`);
      d.side.setAttribute('d', `M${x1 + o},${y1}L${x2 + o},${y2}M${x1 + o - 10},${y1}h20M${x2 + o - 10},${y2}h20`);
      d.top.style.strokeDasharray = d.side.style.strokeDasharray = '2000';
      d.top.style.strokeDashoffset = d.side.style.strokeDashoffset = String(2000 * (1 - k));
      d.wl.textContent = `${Math.round(d.sc.px.w * k)} ${unit}`;
      d.hl.textContent = `${Math.round(d.sc.px.h * k)} ${unit}`;
      Object.assign(d.wl.style, { left: `${(x0 + x1) / 2}px`, top: `${(y0 + y1) / 2 - o - 22}px` });
      Object.assign(d.hl.style, { left: `${(x1 + x2) / 2 + o + 52}px`, top: `${(y1 + y2) / 2}px` });
    }
  }
  const fadeDims = () => { for (const d of dims) for (const e of [d.top, d.side, d.wl, d.hl]) { e.style.transition = 'opacity 0.6s'; e.style.opacity = 0; } };

  // the tour reports its captions and touch points; the callout follows them
  const callout = $('callout'), leader = svgEl('polyline', {});
  const dot = svgEl('circle', { r: 14, fill: 'none', stroke: '#fff', 'stroke-width': 2 });
  let step = 0, touch = null;
  addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.vcd === 'point' && e.source === phoneScreen.frame.contentWindow) touch = [e.data.x, e.data.y];
    if (e.data.vcd === 'say') {
      step++;
      if (!touch) touch = [phoneScreen.px.w / 2, phoneScreen.px.h * 0.4]; // a caption before any tap points at the app itself
      callout.classList.remove('on');
      setTimeout(() => {
        scramble($('cn'), `Step ${two(step)}`, 400);
        $('ct').textContent = e.data.text;
        callout.classList.add('on');
      }, 180);
      scramble($('step'), `Step ${two(step)}\nLive demo`, 500);
    }
    if (e.data === 'vcd:tour-done') close();
  });
  // where the device sits on the sheet, to put the callout where there is room
  const box = new THREE.Box3(), corner = new THREE.Vector3();
  function deviceRect() {
    box.setFromObject(dev.group);
    let r = { l: W, r: 0, t: H, b: 0 };
    for (let i = 0; i < 8; i++) {
      corner.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).project(camera);
      const x = (corner.x * 0.5 + 0.5) * W, y = (0.5 - corner.y * 0.5) * H;
      r = { l: Math.min(r.l, x), r: Math.max(r.r, x), t: Math.min(r.t, y), b: Math.max(r.b, y) };
    }
    return r;
  }
  function drawLeader() {
    const shown = callout.classList.contains('on') && touch && phoneScreen.map;
    leader.style.opacity = dot.style.opacity = shown ? 1 : 0;
    if (!shown) return;
    const [px, py] = mapUV(phoneScreen.map, touch[0] / phoneScreen.px.w, touch[1] / phoneScreen.px.h);
    const r = deviceRect(), roomL = r.l - 72, roomR = W - 72 - r.r, ch = callout.offsetHeight;
    let side, lx, ly, cw;
    if (Math.max(roomL, roomR) >= 250) {
      side = roomR >= roomL ? 'right' : 'left';
      cw = Math.min(330, Math.max(roomL, roomR) - 26);
      lx = side === 'right' ? W - 72 - cw : 72;
      ly = Math.min(H - 140 - ch, Math.max(300, py - ch / 2));
    } else {
      // no room beside a wide device (laptop and phone): the callout sits above it, on the right
      side = 'right';
      cw = 520;
      lx = W - 72 - cw;
      ly = Math.max(300, r.t - ch - 36);
    }
    callout.classList.toggle('left', side === 'left');
    Object.assign(callout.style, { left: `${lx}px`, top: `${ly}px`, width: `${cw}px` });
    const ex = side === 'right' ? lx - 18 : lx + cw + 18, ey = ly + 24, kx = side === 'right' ? ex - 36 : ex + 36;
    // a callout above the devices drops straight down to a point below it, clear of the other screen
    const below = ly + ch < py && px > lx + 24 && px < lx + cw;
    leader.setAttribute('points', below ? `${px},${py} ${px},${ly + ch + 18}` : `${px},${py} ${kx},${ey} ${ex},${ey}`);
    dot.setAttribute('cx', px);
    dot.setAttribute('cy', py);
  }

  // ---- the timeline ----
  const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
  let t0 = 0, phase = 'idle', closeAt = 0, toured = false;
  function close() { if (phase === 'tour') { phase = 'close'; closeAt = (performance.now() - t0) / 1000 + 0.6; } }
  function frame() {
    requestAnimationFrame(frame);
    const T = t0 ? (performance.now() - t0) / 1000 : 0; // the page clock (a frame's own timestamp can run ahead of it)
    // drawing: the device turns a little toward us as its lines are traced
    const draw = ease(T / 3.2);
    rig.rotation.y = (1 - ease(T / 4.6)) * (wide ? 0.22 : 0.55) + 0.04 * Math.sin(T * 0.4);
    rig.rotation.x = 0.025 * Math.sin(T * 0.3);
    for (const l of traces) l.geometry.setDrawRange(0, Math.floor(l.userData.n * ease((draw - l.userData.at) / 0.45)));
    // power on at 3.4 s: the parts take their material, the lines retreat, the glass lights up
    const on = ease((T - 3.4) / 1.2), out = phase === 'close' ? ease((T - closeAt) / 0.8) : 0;
    for (const m of meshes) m.material.opacity = on * (1 - out);
    for (const m of meshes) m.material.depthWrite = on > 0.98 && out === 0;
    lineMat.opacity = 0.95 * (1 - on);
    if (T > 3.4 && phase === 'drawing') { phase = 'powering'; document.body.classList.add('powered'); fadeDims(); }
    if (T > 4.0 && phase === 'powering') { phase = 'tour'; for (const sc of dev.screens) sc.el.classList.add('on'); }
    if (T > 5.0 && !toured && phase === 'tour') { toured = true; phoneScreen.frame.contentWindow.postMessage('vcd:tour', location.origin); }
    renderer.render(scene, camera);
    placeScreens();
    if (phase === 'drawing' || phase === 'powering') drawDims(draw);
    if (phase === 'tour') drawLeader();
    // the close: the device fades out, night falls, the sign is traced and then lit
    if (phase === 'close' && T > closeAt) {
      const c = T - closeAt;
      document.body.classList.add('closing');
      leader.style.opacity = dot.style.opacity = 0;
      for (const sc of dev.screens) { sc.el.style.transition = 'opacity 0.6s'; sc.el.style.opacity = 0; }
      rig.scale.setScalar(1 - 0.12 * ease(c / 0.9));
      rig.visible = c < 1;
      sign.visible = c > 0.5;
      signWire.geometry.setDrawRange(0, Math.floor(signWire.geometry.attributes.position.count * ease((c - 0.5) / 1.1)));
      // a neon tube's first flickers, then steady
      const lit = c < 1.6 ? 0 : c < 1.75 ? 1 : c < 1.9 ? 0.15 : c < 2.0 ? 1 : c < 2.08 ? 0.4 : 1;
      signMat.opacity = lit;
      signWire.material.opacity = 0.9 * (1 - lit);
      if (c > 2.1) document.body.classList.add('signed');
      if (c > 6.2) document.body.dataset.done = '1';
    }
  }
  requestAnimationFrame(frame);

  // ready once the fonts and every demo have loaded; the recorder then calls play()
  window.play = () => { t0 = performance.now(); phase = 'drawing'; };
  window.__dbg = () => ({ T: t0 ? (performance.now() - t0) / 1000 : 0, phase, traces: traces.length, range: traces[0]?.geometry.drawRange.count, n: traces[0]?.userData.n, fps: renderer.info.render.frame });
  Promise.all([document.fonts.ready, ...dev.screens.map((sc) => new Promise((r) => sc.frame.addEventListener('load', r, { once: true })))])
    .then(() => setTimeout(() => { document.body.dataset.ready = '1'; }, 800));
  if (new URLSearchParams(location.search).has('autoplay')) setTimeout(() => window.play(), 1500);
</script>
</body>
