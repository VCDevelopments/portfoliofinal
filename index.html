        <defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" /><stop offset="1" stop-color="#B5DEFF" /></linearGradient></defs>
        <g fill="none" stroke="url(#logo-g)" stroke-linecap="round">
          <line x1="36" y1="52" x2="80" y2="150" stroke-width="30" />
          <path d="M170.3 71.7 A40 40 0 1 0 170.3 128.3" stroke-width="26" opacity="0.75" />
        </g>
      </svg>
      <span><b>vc</b>developments</span>
    </a>
    <div class="meta ch ch-0">
      <p data-scramble>// Portfolio © 2026</p>
      <p data-scramble>Lothar Van Cauwenbergh
Developer &amp; Designer</p>
    </div>
    <section class="manifesto ch ch-0" aria-labelledby="manifesto-title">
      <h2 id="manifesto-title" data-scramble>////// About</h2>
      <p data-scramble>I design and build
websites, iOS apps and
AI tools — from 3D web
experiences to Claude-
powered apps and MCP
servers.</p>
      <ul class="socials">
        <li><a href="https://github.com/VCDevelopments" target="_blank" rel="noopener" data-scramble>GitHub ↗</a></li>
        <li><a href="https://www.linkedin.com/in/lotharvancauwenbergh/" target="_blank" rel="noopener" data-scramble>LinkedIn ↗</a></li>
      </ul>
    </section>
  </header>

  <p class="scroll-hint ch ch-0" data-scramble>Scroll down to
discover.</p>

  <button class="sound" type="button" aria-pressed="false">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" />
      <path class="wave" d="M11 5.5c1 1.4 1 3.6 0 5M12.8 3.8c1.9 2.4 1.9 6 0 8.4" stroke="currentColor" fill="none" stroke-width="1.1" />

    </svg>
    <span>Sound: <b>Off</b></span>
  </button>

  <div id="project-cards" class="ch ch-1" aria-hidden="true"></div>

  <dialog id="project-dialog" aria-labelledby="project-dialog-title">
    <div class="sheet">
      <button class="close" type="button" aria-label="Close">Close ✕</button>
      <span class="status"></span>
      <h2 id="project-dialog-title"></h2>
      <img alt="" />
      <div class="body"></div>
      <span class="stack"></span>
    </div>
  </dialog>

  <nav class="sr-only" aria-label="Projects">
    <h2>Projects</h2>
    <ul id="project-list"></ul>
  </nav>

  <nav class="carousel ch ch-3" aria-label="Social links">
    <button class="arrow prev" type="button" aria-label="Previous link"><i></i></button>
    <div class="track"></div>
