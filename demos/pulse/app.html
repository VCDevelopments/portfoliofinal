<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdPilot</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --line: #e3e6eb; --text: #16191d; --muted: #68717d;
  --accent: #2f6fed; --good: #12805c; --bad: #c2362b; --warn: #a66a00;
  --meta: #2f6fed; --tiktok: #e0457b; --spend: #8b95a3; --revenue: #12805c;
}
/* dark: when chosen, or when the system is dark and Light wasn't chosen */
:root[data-theme="dark"] {
  --bg: #0f1114; --card: #181b20; --line: #2a2f37; --text: #e8eaed; --muted: #949ca8;
  --accent: #6b9bff; --good: #4cc79a; --bad: #ff7a6e; --warn: #e0a83a;
  --meta: #6b9bff; --tiktok: #ff7fa8; --spend: #7b8594; --revenue: #4cc79a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --card: #181b20; --line: #2a2f37; --text: #e8eaed; --muted: #949ca8;
    --accent: #6b9bff; --good: #4cc79a; --bad: #ff7a6e; --warn: #e0a83a;
    --meta: #6b9bff; --tiktok: #ff7fa8; --spend: #7b8594; --revenue: #4cc79a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 5; }
.brand { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.badge.demo { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; color: var(--muted); padding: 5px 11px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
select, input[type=search] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
input[type=search] { min-width: 200px; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; display: grid; gap: 16px; }
.notice { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--card)); border-radius: 10px; padding: 10px 14px; }
.summary { font-size: 16px; line-height: 1.55; }
.summary p { margin: 0 0 6px; } .summary p:last-child { margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi, .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.kpi { padding: 12px 14px; }
.kpi .l { font-size: 13px; font-weight: 600; }
.kpi .v { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12.5px; margin-top: 2px; color: var(--muted); }
.card { padding: 16px 18px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 16px; }
.card .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; max-width: 80ch; }
.cardhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; vertical-align: bottom; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--accent); }
th.t, td.t { text-align: left; }
td.wrap { white-space: normal; min-width: 240px; max-width: 420px; }
td.name { white-space: normal; min-width: 200px; max-width: 320px; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
tr.detail td { background: color-mix(in srgb, var(--accent) 4%, transparent); white-space: normal; text-align: left; padding: 14px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.meta { background: color-mix(in srgb, var(--meta) 15%, transparent); color: var(--meta); }
.pill.tiktok { background: color-mix(in srgb, var(--tiktok) 15%, transparent); color: var(--tiktok); }
.pill.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 17%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.pill.grey { background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font-size: 11px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 13px; }
h3 { font-size: 12.5px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.empty { color: var(--muted); padding: 6px 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 18px; margin-bottom: 12px; }
.facts div span { display: block; color: var(--muted); font-size: 12px; }
dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.gloss dt { font-weight: 600; } dl.gloss dd { margin: 0; color: var(--muted); }
ul.later { margin: 0; padding-left: 18px; color: var(--muted); }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 7px; font-size: 12.5px; display: none; z-index: 20; white-space: pre-line; max-width: 320px; }
</style>
<style>
:root { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
.theme-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.theme-toggle button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted);
  padding: 5px 9px; font: inherit; font-size: 13px; cursor: pointer; }
.theme-toggle button + button { border-left: 1px solid var(--line); }
.theme-toggle button:hover { color: var(--text); }
.theme-toggle button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.theme-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.theme-toggle svg { width: 15px; height: 15px; flex: none; }
@media (max-width: 720px) { .theme-toggle .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
/* signed-in user in the header (served dashboard only) */
.user { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; }
.user a { color: inherit; text-decoration: none; font-weight: 600; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user a:hover { color: var(--accent); }
.user .btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: none; color: var(--text);
  border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.user .btn:hover { border-color: var(--muted); }
</style>
<script>
/* Light / Dark / System. The choice is kept in this browser (localStorage) and applied before
   the page paints, so there's no flash of the wrong theme. */
(() => {
  const KEY = "adpilot-theme";
  const get = () => { try { return localStorage.getItem(KEY) || "system"; } catch { return "system"; } };
  const apply = t => {
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  };
  apply(get());
  const icons = {
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  };
  const labels = { light: "Light", dark: "Dark", system: "System" };
  const mount = () => document.querySelectorAll("[data-theme-toggle]").forEach(el => {
    el.classList.add("theme-toggle");
    el.setAttribute("role", "group");
    el.setAttribute("aria-label", "Colour theme");
    const draw = () => {
      const cur = get();
      el.innerHTML = Object.keys(labels).map(t =>
        `<button type="button" data-t="${t}" aria-pressed="${t === cur}" title="${labels[t]} theme">${icons[t]}<span class="lbl">${labels[t]}</span></button>`).join("");
    };
    el.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      try { localStorage.setItem(KEY, b.dataset.t); } catch {}
      apply(b.dataset.t); draw();
      document.dispatchEvent(new CustomEvent("adpilot-theme", { detail: b.dataset.t }));
    };
    draw();
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
  // keep other open tabs in step
  window.addEventListener("storage", e => { if (e.key === KEY) { apply(get()); mount(); } });
})();
</script>

</head>

      <div class="facts">
        ${fact("Product", esc(a.title))}${fact("Ad set", esc(a.adset || "–"))}${fact("Creative", esc(tagsOf(a) || "–"))}
        ${fact("Product price", esc(money2(a.price)))}${fact("Breakeven return", a.breakeven ? times(a.breakeven) : "unknown, set the product cost in Shopify")}
        ${fact("Running since", esc(String(a.created_at || "–").slice(0, 10)))}${fact("Name on " + (a.platform === "meta" ? "Meta" : "TikTok"), esc(a.name))}
      </div>
      <div class="cardhead"><b>Day by day</b>${legend}</div>${lineChart(a.daily, "Daily spend and sales for this ad", 900, 150)}
      ${days.length ? `<div class="scroll"><table><thead><tr><th class="t">Day</th><th>Spent</th><th>Views</th><th>Clicks</th><th>Click rate</th><th>Purchases</th><th>Sales</th></tr></thead><tbody>${
        days.map(d => `<tr><td class="t">${d.date}</td><td>${esc(money2(d.spend))}</td><td>${num(d.impressions)}</td><td>${num(d.clicks)}</td><td>${pct(div(d.clicks * 100, d.impressions), 2)}</td><td>${num(d.purchases)}</td><td>${esc(money2(d.revenue))}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </td></tr>`;
  }

  function adsCard(ads) {
    const q = state.q.trim().toLowerCase();
    const statuses = [...new Set(ads.map(a => a.statusLabel))];
    const shown = ads.filter(a => (state.status === "all" || a.statusLabel === state.status) && (!q || (a.title + " " + a.name + " " + (a.adset || "")).toLowerCase().includes(q)));
    const cols = [
      { k: "title", label: "Ad", text: 1, cls: "name", html: a => `<b title="${esc(a.title)}">${esc(short(a.title))}</b><div class="muted small">${pill(a.platform)} ${esc(tagsOf(a))}</div>` },
      { k: "statusLabel", label: "Status", text: 1, html: a => `<span class="pill ${a.statusCls}">${esc(a.statusLabel)}</span>` },
      { k: "verdict", label: "How it's doing", text: 1, tip: "A plain reading of the numbers in the selected period. Click a row to see why.", html: a => `<span class="pill ${a.verdictCls}">${esc(a.verdict)}</span>` },
      { k: "spend", label: "Spent", html: a => esc(money2(a.spend)) },
      { k: "impressions", label: "Views", tip: "How many times the ad was shown (impressions).", html: a => num(a.impressions) },
      { k: "clicks", label: "Clicks", html: a => num(a.clicks) },
      { k: "ctr", label: "Click rate", tip: "Clicks divided by views (CTR). Around 1% or more is healthy.", html: a => pct(a.ctr, 2) },
      { k: "cpc", label: "Cost per click", html: a => esc(money2(a.cpc)) },
      { k: "purchases", label: "Purchases", html: a => num(a.purchases) },
      { k: "revenue", label: "Sales", tip: "Order value the ad platform credits to this ad.", html: a => esc(money2(a.revenue)) },
      { k: "roas", label: "Return", tip: "Sales divided by spend (ROAS). 2× means every 1 spent brought back 2.", html: a => `<span class="${a.roas == null ? "" : a.breakeven ? (a.roas >= a.breakeven ? "pos" : "neg") : ""}">${times(a.roas)}</span>` },
      { k: "cpa", label: "Cost per purchase", html: a => esc(money2(a.cpa)) },
    ];
    return `<section class="card"><h2>Your ads</h2>
      <div class="sub">One row per ad for the selected period. Click a column title to sort, click a row for the day-by-day detail.</div>
      <div class="tools"><input type="search" id="q" placeholder="Search ads or products" value="${esc(state.q)}">
        <select id="status"><option value="all">All statuses</option>${statuses.map(s => `<option ${s === state.status ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <span class="muted small">${num(shown.length)} of ${num(ads.length)} ads</span></div>
      ${shown.length ? table("ads", cols, shown, { rowAttr: a => `class="click" data-ad="${esc(a.ad_id)}"`, after: (a, n) => state.open === a.ad_id ? adDetail(a, n) : "" }) : '<div class="empty">No ads match.</div>'}</section>`;
  }

  function productsCard(rows) {
    const by = {}; for (const r of rows) (by[r.product_id] ??= []).push(r);
    const list = Object.entries(by).map(([id, rs]) => ({ id, title: titles[id] || "Not linked to a product", ...totals(rs) }));
    if (!list.length) return "";
    const cols = [
      { k: "title", label: "Product", text: 1, cls: "name", html: p => `<span title="${esc(p.title)}">${esc(short(p.title, 60))}</span>` },
      { k: "spend", label: "Spent", html: p => esc(money2(p.spend)) }, { k: "revenue", label: "Sales", html: p => esc(money2(p.revenue)) },
      { k: "roas", label: "Return", html: p => times(p.roas) }, { k: "purchases", label: "Purchases", html: p => num(p.purchases) },
      { k: "cpa", label: "Cost per purchase", html: p => esc(money2(p.cpa)) }, { k: "ctr", label: "Click rate", html: p => pct(p.ctr, 2) },
    ];
    return `<section class="card"><h2>By product</h2><div class="sub">The same numbers added up per product.</div>${table("products", cols, list)}</section>`;
  }

  function budgetCard() {
    const rows = (D.budget || []).filter(onPlatform);
    if (!rows.length) return "";
    const act = a => { a = String(a).split(" ")[0]; return { increase: ["Give more", "good"], scale: ["Give more", "good"], keep: ["Keep", "good"], hold: ["Keep", "grey"], reduce: ["Give less", "warn"], pause: ["Pause", "bad"] }[a] || [a, "grey"]; };
    const cols = [
      { k: "name", label: "Ad set", text: 1, cls: "name", html: r => `${esc(short(r.product || r.name))}<div class="muted small">${pill(r.platform)} ${esc(String(r.name).split("|").slice(1).join(" · ").trim())}</div>` },
      { k: "daily_budget", label: "Budget now", html: r => r.daily_budget ? esc(money2(r.daily_budget)) + " / day" : '<span class="muted" data-tip="This ad set has no budget of its own; the budget is set on the campaign.">set on campaign</span>' },
      { k: "recommended_budget", label: "Suggested", html: r => isFinite(r.recommended_budget) && r.recommended_budget != null ? `<b>${esc(money2(r.recommended_budget))}</b> / day` : "–" },
      { k: "action", label: "Suggestion", text: 1, html: r => { const [l, c] = act(r.action); return `<span class="pill ${c}">${esc(l)}</span>`; } },
      { k: "roas_est", label: "Return (likely range)", tip: "Estimated sales per 1 spent, with the range it most likely falls in.", html: r => r.roas_est == null ? "–" : `${times(r.roas_est)} <span class="muted">(${num(r.roas_p10, 1)}–${num(r.roas_p90, 1)})</span>` },
      { k: "p_profitable", label: "Chance it's profitable", html: r => r.roas_est == null ? "–" : pct(r.p_profitable * 100) },
      { k: "reason", label: "Why", text: 1, cls: "wrap muted", html: r => esc(String(r.reason).replace(/ROAS ≈ nan[^.]*\.\s*/i, "Not enough data yet. ").replace(/,?\s*0% chance profitable\.?/i, r.roas_est == null ? "" : "$&")) },
    ];
    const planned = sum(rows, "recommended_budget");
    return `<section class="card"><h2>Budget suggestions</h2><div class="sub">How AdPilot would split ${esc(money2(D.daily_budget))} a day across your ad sets${planned ? ` (${esc(money2(planned))} assigned)` : ""}. ${D.autopilot_live ? "The autopilot is on: it applies these by itself, within its limits (at most 30% per ad set per day, never above the daily total)." : "These are suggestions only: nothing changes on Meta or TikTok until you switch the autopilot on."}</div>${table("budget", cols, rows)}</section>`;
  }

  function audiencesCard() {
    const ids = Object.keys(D.audiences || {});
    if (!ids.length) return "";
    const enough = l => (l || []).filter(s => s.impressions == null || s.impressions >= 1000);
    const ready = id => enough(D.audiences[id].scale).length + enough(D.audiences[id].exclude).length + (D.audiences[id].try_next || []).length;
    if (!ids.some(ready)) return "";
    const src = D.audiences[state.product] || D.audiences[ids[0]];
    const a = { scale: enough(src.scale), exclude: enough(src.exclude), try_next: src.try_next };
    const label = s => `${pill(s.platform)} ${esc(s.gender === "all" ? "everyone" : s.gender)} · ${esc(s.age_band)} · ${esc(s.interest || "broad")}`;
    const block = (title, list, fn) => `<h3>${title}</h3>${list && list.length ? `<div class="chips">${list.map(s => `<span class="chip">${label(s)} ${fn(s)}</span>`).join("")}</div>` : '<div class="muted">Nothing here yet.</div>'}`;
    const vs = s => `<b class="${s.vs_avg_pct >= 0 ? "pos" : "neg"}">${s.vs_avg_pct > 0 ? "+" : ""}${num(s.vs_avg_pct)}% vs average</b> · return ${times(s.roas)}`;
    return `<section class="card"><div class="cardhead"><div><h2>Audiences</h2><div class="sub">Which groups of people buy most per product.</div></div>
      <select id="product">${ids.map(id => `<option value="${esc(id)}" ${id === state.product ? "selected" : ""}>${esc(short(D.audiences[id].product || id, 60))}</option>`).join("")}</select></div>
      ${starterNote}${block("Spend more on", a.scale, vs)}${block("Stop showing to", a.exclude, vs)}${block("Worth testing next", a.try_next, s => `<b>${num(s.pred_sales_per_1k, 2)}</b> predicted sales per 1,000 views`)}</section>`;
  }

  const basis = D.model_basis || { own: 0, benchmark: 0 };
  const starter = basis.benchmark > 0;
  const starterNote = starter ? `<div class="notice small" style="margin-bottom:12px"><b>Starter estimates, not your results yet.</b> These come from published industry benchmarks for online stores, plus ${num(basis.own)} ad-${basis.own === 1 ? "week" : "weeks"} of your own data. Your own results take over as they come in and fully replace the benchmarks at ${num(basis.fade_out_at)} ad-weeks.</div>` : "";

  function liftsCard() {
    const rows = (D.lifts || []).filter(onPlatform);
    if (!rows.length) return "";
    const c = v => `<span class="${v > 0.5 ? "pos" : v < -0.5 ? "neg" : "muted"}">${v > 0 ? "+" : ""}${num(v, 1)}%</span>`;
    const cols = [{ k: "attribute", label: "When an ad has…", text: 1 }, { k: "platform", label: "Platform", text: 1, html: r => pill(r.platform) },
      { k: "ctr", label: "Click rate", html: r => c(r.ctr) }, { k: "sales_rate", label: "Sales", html: r => c(r.sales_rate) }, { k: "virality", label: "Shares and saves", html: r => c(r.virality) }];
    return `<section class="card"><h2>What makes your ads work</h2><div class="sub">Predicted change when an ad has this feature, everything else being equal.</div>${starterNote}${table("lifts", cols, rows)}</section>`;
  }

  function risingCard() {
    const rows = (D.rising || []).filter(onPlatform);
    if (!rows.length) return "";
    const cols = [{ k: "product", label: "Ad", text: 1, cls: "name", html: r => `${esc(short(r.product || r.name))}<div class="muted small">${pill(r.platform)} ${esc(String(r.name).split("|").slice(1).join(" · ").trim())}</div>` },
      { k: "spend", label: "Spent so far", html: r => esc(money2(r.spend)) }, { k: "pred_ctr", label: "Predicted click rate", html: r => pct(r.pred_ctr, 2) },
      { k: "pred_sales", label: "Predicted sales per 1,000 views", html: r => num(r.pred_sales, 2) }];
    return `<section class="card"><h2>Ads to watch</h2><div class="sub">Ads with little spend so far that the models expect to do well.</div>${starterNote}${table("rising", cols, rows)}</section>`;
  }

  function modelsCard() {
    const latest = {}; for (const r of D.model_runs || []) latest[r.target] = r;
    const rows = Object.values(latest); if (!rows.length) return "";
    return `<section class="card"><h2>${starter ? "What the predictions are based on" : "How reliable the predictions are"}</h2><div class="sub">${starter ? "The bars show which ad features the models lean on most. Accuracy scores are hidden until the models run on your own results." : "Each model is tested on ads it has never seen. 1.00 would be perfect, 0 is no better than guessing."}</div>${starterNote}${rows.map(r => {
      const imp = Object.entries(r.importances || {}).sort((a, b) => b[1] - a[1]).slice(0, 4), max = Math.max(...imp.map(i => i[1]), 1e-9);
      return `<h3>${esc(D.targets?.[r.target] || r.target)}${starter ? "" : ` · score ${num(r.score, 2)}`}</h3><table><tbody>${imp.map(([k, v]) => `<tr><td class="t">${esc(k.replace(/_/g, " "))}</td><td style="width:55%"><div class="bar"><i style="width:${Math.max(2, v / max * 100)}%"></i></div></td></tr>`).join("")}</tbody></table>`;
    }).join("")}</section>`;
  }

  function funnelCard() {
    const by = {}; for (const r of (D.leads || []).filter(onPlatform)) by[r.status] = (by[r.status] || 0) + r.n;
    const parts = [];
    if (Object.keys(by).length) parts.push(`<h3>Leads from ads</h3><div class="chips">${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<span class="chip"><b>${num(n)}</b> ${esc(s)}</span>`).join("")}</div>`);
    if ((D.crm || []).length) parts.push(`<h3>Contacts in your CRM</h3><div class="chips">${D.crm.map(c => `<span class="chip"><b>${num(c.n)}</b> ${esc(c.stage || "unknown")}${c.ltv ? ` · ${esc(money(c.ltv))} lifetime value` : ""}</span>`).join("")}</div>`);
    return parts.length ? `<section class="card"><h2>Leads and customers</h2><div class="sub">People who signed up through ads, and where they are now.</div>${parts.join("")}</section>` : "";
  }

  function launchCard() {
    const p = D.launch_plan; if (!p) return "";
    const ads = (p.campaigns || []).flatMap(c => (c.adsets || []).flatMap(s => s.ads || []));
    return `<section class="card"><h2>Next launch plan</h2><div class="sub">${num(ads.length)} new ads planned at ${esc(money2(p.total_daily_budget))} a day. They are created paused, so nothing spends until you switch them on.</div>
      <div class="scroll"><table><thead><tr><th class="t">Product</th><th class="t">Audience</th><th class="t">Hook</th><th>Predicted click rate</th></tr></thead><tbody>${
      ads.map(a => { const b = a.brief || {}, f = b.predicted || {}; return `<tr><td class="t">${esc(short(b.product || a.key))}</td><td class="t">${esc(b.audience)}</td><td class="t">${esc(b.hook_type)}</td><td>${pct(f.ctr_pct, 2)}</td></tr>`; }).join("")}</tbody></table></div></section>`;
  }

  function laterCard(shown) {
    const items = [];
    if (!shown.models) items.push("<b>Predictions and “what makes your ads work”</b> appear once about 40 ad-weeks of results exist (for example 10 ads running for 4 weeks).");
    if (!shown.audiences) items.push("<b>Audience advice</b> appears once ad sets have been shown to enough people.");
    if (!shown.budget) items.push("<b>Budget suggestions</b> appear once there are active ad sets.");
    return items.length ? `<section class="card"><h2>Still to come</h2><div class="sub">These sections are hidden until there is enough data to fill them.</div><ul class="later">${items.map(i => `<li>${i}</li>`).join("")}</ul></section>` : "";
  }

  const glossary = `<section class="card"><h2>What the words mean</h2><dl class="gloss">
    <dt>Views</dt><dd>How many times an ad was shown. The ad platforms call these impressions.</dd>
    <dt>Click rate</dt><dd>Clicks divided by views (CTR). It shows how well the ad catches attention.</dd>
    <dt>Sales</dt><dd>Order value that Meta or TikTok credit to an ad, measured by the pixel on your store.</dd>
    <dt>Return</dt><dd>Sales divided by ad spend (ROAS). 2× means every 1 spent on ads brought back 2 in sales.</dd>
    <dt>Breakeven return</dt><dd>The return an ad needs so that the product's profit covers the ad cost. It depends on the product's price and cost in Shopify.</dd>
    <dt>Cost per purchase</dt><dd>Ad spend divided by purchases (CPA).</dd>
    <dt>Ad set</dt><dd>A group of ads shown to the same audience with one shared daily budget.</dd></dl></section>`;

  function render() {
    const rows = inWindow(D.product_daily).filter(onPlatform), ads = adRows();
    const cards = { budget: budgetCard(), audiences: audiencesCard(), lifts: liftsCard(), rising: risingCard(), models: modelsCard() };
    const focus = document.activeElement?.id === "q" ? document.activeElement.selectionStart : null;
    app.innerHTML = `
      ${D.is_demo ? '<div class="notice">This is sample data. Connect your accounts with <code>python -m adpilot setup</code> to see your own store.</div>' : ""}
      ${summary(rows, ads)}
      ${kpis(rows)}
      ${adsCard(ads)}
      <section class="card"><div class="cardhead"><div><h2>Spend and sales per day</h2><div class="sub">All ads together, last ${state.days} days.</div></div>${legend}</div>${lineChart(rows, "Daily spend and sales")}</section>
      ${productsCard(rows)}
      ${cards.budget}
      ${cards.audiences}
      ${cards.rising || cards.lifts ? `<div class="two">${cards.rising}${cards.lifts}</div>` : ""}
      ${funnelCard()}
      ${cards.models}
      ${launchCard()}
      ${laterCard(cards)}
      ${glossary}`;
    const sel = document.getElementById("product"); if (sel) sel.onchange = () => { state.product = sel.value; render(); };
    const st = document.getElementById("status"); if (st) st.onchange = () => { state.status = st.value === "All statuses" ? "all" : st.value; render(); };
    const q = document.getElementById("q");
    if (q) { q.oninput = () => { state.q = q.value; render(); }; if (focus != null) { q.focus(); q.setSelectionRange(focus, focus); } }
  }

  app.addEventListener("click", e => {
    const th = e.target.closest("th.sortable");
    if (th) {
      const [k, dir] = state.sort[th.dataset.table] || [];
      state.sort[th.dataset.table] = [th.dataset.k, k === th.dataset.k ? -dir : th.dataset.text ? 1 : -1];
      return render();
    }
    const tr = e.target.closest("tr.click");
    if (tr) { state.open = state.open === tr.dataset.ad ? null : tr.dataset.ad; render(); }
  });

  const tip = document.getElementById("tip");
  document.addEventListener("mousemove", e => {
    const t = e.target.closest?.("[data-tip]");
    if (!t) { tip.style.display = "none"; return; }
    tip.textContent = t.dataset.tip; tip.style.display = "block";
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)) + "px"; tip.style.top = e.clientY + 16 + "px";
  });
  if ((D.ads || []).length === 1) state.open = D.ads[0].ad_id;
  render();
})();
</script>

<!-- VCDevelopments portfolio: AdPilot's real dashboard (python -m adpilot dashboard, on its sample store),
     shown in a Safari window by index.html. -->
</body>
</html>
