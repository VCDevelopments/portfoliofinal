<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>Pulse on the laptop · demo</title>
  <!-- Pulse's real dashboard (app.html) as the laptop shows it: a Safari window on localhost:8765. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #111418; }
    body { font: 13px/1 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    /* macOS menu bar (no logo); the display's notch sits in the middle of it */
    .menubar { height: 32px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #26272b; color: #fff; }
    .menubar b { font-weight: 700; }
    .menubar .right { margin-left: auto; }
    /* Safari's toolbar, dark to match the page */
    .bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #1d2024; border-bottom: 1px solid #2c3036; color: #9aa1aa; }
    .bar i { width: 12px; height: 12px; border-radius: 50%; }
    .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
    .bar .url { margin: 0 auto; width: 420px; height: 28px; border-radius: 7px; background: #2c3036; display: flex; align-items: center; justify-content: center; color: #e6e9ee; }
    iframe { display: block; width: 100%; height: calc(100% - 76px); border: 0; }
  </style>
</head>
<body>
  <div class="menubar"><b>Safari</b><span>File</span><span>Edit</span><span>View</span><span>History</span><span>Window</span><span class="right" id="clock"></span></div>
  <div class="bar"><i></i><i></i><i></i><span class="url">localhost:8765</span></div>
  <iframe id="web" src="app.html" title="Pulse dashboard"></iframe>
  <script>
    const clock = () => { document.getElementById('clock').textContent = new Date().toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace(',', ''); };
    clock();
    setInterval(clock, 10000);
  </script>
  <script type="module">
    import { onTour } from '../tour.js';
    const doc = () => document.getElementById('web').contentDocument;
    const $ = (s) => doc().querySelector(s), $$ = (s) => [...doc().querySelectorAll(s)];
    const button = (group, text) => () => $$(`${group} button`).find((b) => b.textContent.trim() === text);
    const section = (title) => $$('#app h2, #app h3').find((h) => h.textContent.trim() === title)?.closest('section, .two');
    const below = (title) => () => { const el = section(title); return el ? el.getBoundingClientRect().top + page().scrollTop - 80 : 0; };
    const page = () => doc().scrollingElement;
    const typeInto = (text) => async () => {
      for (const ch of text) { $('#q').value += ch; $('#q').dispatchEvent(new Event('input', { bubbles: true })); await new Promise((r) => setTimeout(r, 90)); }
    };
    onTour(() => [
      { scroll: page, to: 0, say: 'Spend, sales and return, in plain words', after: 1300 },
      { tap: button('#range', '90 days'), say: 'Switch the period', after: 900 },
      { tap: button('#platform', 'Meta'), say: 'Or look at one platform', after: 1000 },
      { tap: button('#platform', 'All'), after: 500 },
      { at: () => $('#q'), run: typeInto('roller'), say: 'Find any ad or product', after: 900 },
      { tap: () => $('tbody tr.click'), say: 'Open an ad for its day-by-day detail', after: 2200 },
      { scroll: page, to: below('Budget suggestions'), say: 'Where the budget should go next', after: 1600 },
      { scroll: page, to: below('Ads to watch'), say: 'Ads to watch, and why', after: 1600 },
      { tap: '[data-theme-toggle] [data-t="light"]', say: 'Light or dark', after: 1200 },
      { scroll: page, to: 0, say: 'Your turn: click around', after: 1400 },
    ].map((s) => (typeof s.tap === 'string' ? { ...s, tap: () => $(s.tap) } : s)));
  </script>
</body>
</html>
