<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Relay · demo</title>
  <link rel="stylesheet" href="../ios.css" />
  <style>
    :root { --tint: #11a08a; --bg: #f2f2f7; }
    /* pairing: the camera looks at the laptop's code */
    #pair { background: #0d0f10; color: #fff; padding: 0; overflow: hidden; --sb: #fff; }
    .viewfinder { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 40%, #3a4348, #101314 70%); }
    .viewfinder .laptop { position: absolute; left: 50%; top: 210px; width: 300px; height: 200px; margin-left: -150px; border-radius: 10px; background: #e9f2f1; box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: perspective(600px) rotateX(8deg) rotateZ(-3deg); filter: blur(0.6px) brightness(0.92); display: grid; place-items: center; }
    .viewfinder .laptop svg { width: 120px; height: 120px; }
    .frame { position: absolute; left: 50%; top: 220px; width: 190px; height: 190px; margin-left: -95px; }
    .frame i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; border-radius: 4px; }
    .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
    .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
    .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
    .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
    .frame .line { position: absolute; left: 8px; right: 8px; height: 2px; background: #3de0c0; box-shadow: 0 0 12px #3de0c0; top: 10px; opacity: 0; }
    .scanning .frame .line { opacity: 1; animation: scan 1.1s ease-in-out infinite alternate; }
    @keyframes scan { to { top: 176px; } }
    .found .frame i { border-color: #3de0c0; }
    .pair-text { position: absolute; left: 24px; right: 24px; top: 470px; text-align: center; }
    .pair-text h1 { font-size: 22px; line-height: 28px; font-weight: 700; }
    .pair-text p { color: rgba(255,255,255,.7); font-size: 15px; line-height: 20px; margin-top: 6px; }
    .shutter { position: absolute; left: 50%; bottom: 70px; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
    .shutter::after { content: ""; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .shutter:active::after { transform: scale(.9); }
    .tap-hint { position: absolute; left: 0; right: 0; bottom: 154px; text-align: center; font-size: 13px; color: rgba(255,255,255,.75); }
    /* file list */
    .chip { display: inline-flex; align-items: center; gap: 6px; margin: 0 16px; padding: 6px 12px; border-radius: 16px; background: #fff; font-size: 13px; line-height: 18px; font-weight: 600; }
    .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(52,199,89,.2); }
    .file { --inset: 76px; }
    .file .name { font-size: 16px; }
    .progress { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 6px; overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--tint); border-radius: 2px; transition: width .2s linear; }
    .new { animation: pop .5s cubic-bezier(.32,.72,0,1); }
    @keyframes pop { from { opacity: 0; transform: translateY(-10px); } }
    .send { position: absolute; z-index: 30; left: 16px; right: 16px; bottom: 42px; }
    .send .btn { box-shadow: 0 8px 24px rgba(17,160,138,.35); }
    #files { padding-bottom: 120px; }
    /* photo picker */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid button { position: relative; aspect-ratio: 1; background-size: cover; }
    .grid button::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.15); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .grid button[aria-pressed="true"]::after { background: var(--blue) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22"><path d="m6.5 11.5 3 3 6-7" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>') center/100%; }
    .sheet-head button { color: var(--blue); font-weight: 400; }
    .sheet-head button.done { font-weight: 600; }
    .sheet-head button[disabled] { opacity: .35; }
    .picker-tabs { margin: 0 16px 10px; }
  </style>
</head>
<body>
<div class="screen">
  <section class="page no-tabs" id="pair" data-root>
    <div class="viewfinder"><div class="laptop" id="qr"></div></div>
    <div class="frame"><i></i><i></i><i></i><i></i><div class="line"></div></div>
    <div class="pair-text"><h1>Scan the code on your laptop</h1><p>Relay opens on your laptop with a code. Scan it once and this phone stays paired.</p></div>
    <div class="tap-hint">Tap to scan</div>
    <button class="shutter" id="scan" type="button" aria-label="Scan code"></button>
  </section>

  <section class="page no-tabs" id="files" hidden>
    <div class="large-title">Relay</div>
    <span class="chip"><i></i>Connected to your laptop</span>
    <div class="section-head">Shared files</div>
    <div class="list" id="list"></div>
    <div class="section-foot">Files go straight to your laptop over Wi-Fi. Tap one to save it.</div>
  </section>
  <div class="send" id="send" hidden><button class="btn" type="button">Send photos</button></div>

  <div class="sheet" id="picker" style="--sheet:#fff">
    <div class="grabber"></div>
    <div class="sheet-head"><button type="button" id="p-cancel">Cancel</button><span>Photos</span><button type="button" class="done" id="p-add" disabled>Add</button></div>
    <div class="segmented picker-tabs"><button type="button" aria-pressed="true">Photos</button><button type="button" aria-pressed="false">Albums</button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script type="module">
  import { $, $$, chrome, root, push, openSheet, closeSheets, actionSheet, hud, banner, wait } from '../ios.js';
  import { files, state, onChange, addFile, deleteFile, pair, newId, size, thumb, qr } from './shared.js';
  chrome();
  root('pair');
  $('#qr').innerHTML = qr();

  async function connect() {
    $('#pair').classList.add('scanning');
    await wait(1300);
    $('#pair').classList.replace('scanning', 'found');
    await wait(350);
    pair();
  }
  $('#scan').addEventListener('click', connect);
  function showFiles() {
    if (!$('#files').hidden) return;
    push('files');
    $('#send').hidden = false;
    render();
  }

  function render(fresh) {
    $('#list').replaceChildren(...files.map((f) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `cell file${f.id === fresh ? ' new' : ''}`;
      b.dataset.id = f.id;
      b.append(thumb(f, 48));
      const t = document.createElement('span');
      t.className = 'grow';
      t.innerHTML = '<div class="name ellipsis"></div><div class="sub"></div>';
      t.firstChild.textContent = f.name;
      t.lastChild.textContent = f.uploading ? 'Sending…' : `${size(f.size)} · from ${f.from === 'phone' ? 'this phone' : 'laptop'}`;
      if (f.uploading) t.insertAdjacentHTML('beforeend', `<div class="progress"><i style="width:${f.uploading}%"></i></div>`);
      b.append(t);
      return b;
    }));
  }
  onChange((e) => {
    if (e.t === 'paired' || (e.t === 'state' && state.paired)) showFiles();
    if (!$('#files').hidden) render(e.t === 'add' ? e.file.id : null);
    if (e.t === 'add' && !e.local) banner('<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>', 'Relay', `${e.file.name} arrived from your laptop`);
    if (e.t === 'add' && !e.local) $('.banner .app').style.background = '#11a08a';
  });

  // tap a file: save it or delete it
  $('#list').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-id]');
    const f = b && files.find((o) => o.id === b.dataset.id);
    if (!f || f.uploading) return;
    const save = f.kind === 'doc' ? 'Save to Files' : f.kind === 'video' ? 'Save Video' : 'Save Image';
    const pick = await actionSheet(f.name, [{ label: save }, { label: 'Save to Files' }, { label: 'Delete', destructive: true }].filter((o, i, a) => a.findIndex((x) => x.label === o.label) === i));
    if (pick === 'Delete') deleteFile(f.id);
    else if (pick === 'Save to Files') hud('Saved to Files');
    else if (pick) hud('Saved to Photos');
  });

  // the photo picker: a few sample photos to send to the laptop
  const PHOTOS = [
    ['IMG_2502.HEIC', 'linear-gradient(160deg,#ffd29a,#ff8a5c 50%,#5b2d4f)'],
    ['IMG_2503.HEIC', 'linear-gradient(200deg,#a8e6ff,#3c8dde 60%,#123a6b)'],
    ['IMG_2504.HEIC', 'radial-gradient(circle at 30% 30%,#f9f3d2,#9cc48a 45%,#2f5d3a)'],
    ['IMG_2505.HEIC', 'linear-gradient(180deg,#2b2d42,#8d99ae 60%,#edf2f4)'],
    ['IMG_2506.HEIC', 'linear-gradient(135deg,#fbc2eb,#a6c1ee)'],
    ['IMG_2507.HEIC', 'radial-gradient(circle at 70% 25%,#fff3b0,#e09f3e 40%,#540b0e)'],
    ['IMG_2508.HEIC', 'linear-gradient(160deg,#d4fc79,#96e6a1)'],
    ['IMG_2509.HEIC', 'linear-gradient(200deg,#0f2027,#2c5364)'],
    ['IMG_2510.HEIC', 'linear-gradient(120deg,#f6d365,#fda085)'],
    ['IMG_2511.HEIC', 'radial-gradient(circle at 50% 80%,#ffd6a5,#ff7b54 40%,#3c1642)'],
    ['IMG_2512.HEIC', 'linear-gradient(180deg,#89f7fe,#66a6ff)'],
    ['IMG_2513.HEIC', 'linear-gradient(140deg,#434343,#000)'],
  ];
  $('#grid').innerHTML = PHOTOS.map(([n, look], i) => `<button type="button" data-p="${i}" aria-pressed="false" aria-label="${n}" style="background:${look}"></button>`).join('');
  $('#grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    const n = $$('#grid [aria-pressed="true"]').length;
    $('#p-add').disabled = !n;
    $('#p-add').textContent = n ? `Add (${n})` : 'Add';
  });
  $('#send button').addEventListener('click', () => openSheet($('#picker')));
  $('#p-cancel').addEventListener('click', closeSheets);
  $('#p-add').addEventListener('click', async () => {
    const chosen = $$('#grid [aria-pressed="true"]').map((b) => PHOTOS[b.dataset.p]);
    $$('#grid [aria-pressed]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    $('#p-add').disabled = true;
    $('#p-add').textContent = 'Add';
    closeSheets();
    // each photo uploads with a progress bar, then appears on the laptop too
    for (const [name, look] of chosen) {
      const f = { id: newId(), name, size: 1.6e6 + Math.random() * 2e6, from: 'phone', kind: 'image', look, uploading: 1 };
      files.unshift(f);
      render(f.id);
      for (let p = 0; p <= 100; p += 12 + Math.random() * 18) { f.uploading = Math.min(100, p); render(); await wait(90); }
      files.splice(files.indexOf(f), 1);
      delete f.uploading;
      addFile(f);
    }
    if (chosen.length) hud(chosen.length > 1 ? `Sent ${chosen.length} photos` : 'Sent to laptop');
  });
</script>
</body>
</html>
