<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Relay on iPhone · demo</title>
  <!-- Relay's real page (app.html) as the phone sees it: in Safari, after scanning the laptop's code. -->
  <link rel="stylesheet" href="../ios.css" />
  <link rel="stylesheet" href="../safari.css" />
  <style>
    :root { --page: #f6f5f2; }
    @media (prefers-color-scheme: dark) { :root { --page: #141413; } }
    /* the Photos picker iOS shows for "Choose files or photos" */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid button { position: relative; aspect-ratio: 1; background-size: cover; }
    .grid button::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.15); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .grid button[aria-pressed="true"]::after { background: var(--blue) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22"><path d="m6.5 11.5 3 3 6-7" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>') center/100%; }
    .sheet-head button { color: var(--blue); font-weight: 400; }
    .sheet-head button.done { font-weight: 600; }
    .sheet-head button[disabled] { opacity: .35; }
    .picker-tabs { margin: 0 16px 10px; }
  </style>
</head>
<body>
<div class="screen">
  <div class="topfill"></div>
  <iframe class="webview" id="web" src="app.html?phone" title="Relay"></iframe>
  <div class="safari">
    <div class="addr"><span class="aa">aA</span><span class="url"><svg viewBox="0 0 10 13"><rect x="0.5" y="5.5" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M2.5 6V4a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>192.168.1.24</span><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="tools">
      <button type="button" disabled aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" disabled aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M8 10H6v11h12V10h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Bookmarks"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.6-4.6-2-8-2v14c3.4 0 6 .4 8 2 2-1.6 4.6-2 8-2V4c-3.4 0-6 .4-8 2zm0 0v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Tabs"><svg viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 4.5h10.5a2.5 2.5 0 0 1 2.5 2.5v10.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
  </div>

  <div class="sheet" id="picker" style="--sheet:#fff">
    <div class="grabber"></div>
    <div class="sheet-head"><button type="button" id="p-cancel">Cancel</button><span>Photos</span><button type="button" class="done" id="p-add" disabled>Add</button></div>
    <div class="segmented picker-tabs"><button type="button" aria-pressed="true">Photos</button><button type="button" aria-pressed="false">Albums</button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script type="module">
  import { $, $$, chrome, openSheet, closeSheets, actionSheet, hud, onTour } from '../ios.js';
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark'); // Safari follows the page
  chrome();
  const web = $('#web');
  const app = () => web.contentWindow, doc = () => web.contentDocument;

  // iOS's photo picker, for the page's "Choose files or photos"
  const PHOTOS = [
    ['IMG_2502.JPG', ['#ffd29a', '#ff8a5c', '#5b2d4f'], true],
    ['IMG_2503.JPG', ['#a8e6ff', '#3c8dde', '#123a6b'], false],
    ['IMG_2504.JPG', ['#f9f3d2', '#9cc48a', '#2f5d3a'], true],
    ['IMG_2505.JPG', ['#2b2d42', '#8d99ae', '#edf2f4'], false],
    ['IMG_2506.JPG', ['#fbc2eb', '#a6c1ee', '#6a7bd6'], false],
    ['IMG_2507.JPG', ['#fff3b0', '#e09f3e', '#540b0e'], true],
    ['IMG_2508.JPG', ['#d4fc79', '#96e6a1', '#2f6f4f'], false],
    ['IMG_2509.JPG', ['#0f2027', '#203a43', '#2c5364'], false],
    ['IMG_2510.JPG', ['#f6d365', '#fda085', '#7b3f61'], true],
  ];
  $('#grid').innerHTML = PHOTOS.map(([n, c], i) => `<button type="button" data-p="${i}" aria-pressed="false" aria-label="${n}" style="background:linear-gradient(${c.join(',')})"></button>`).join('');
  $('#grid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]');
    if (!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    const n = $$('#grid [aria-pressed="true"]').length;
    $('#p-add').disabled = !n;
    $('#p-add').textContent = n ? `Add (${n})` : 'Add';
  });
  $('#p-cancel').addEventListener('click', closeSheets);
  $('#p-add').addEventListener('click', async () => {
    const chosen = $$('#grid [aria-pressed="true"]').map((b) => PHOTOS[b.dataset.p]);
    $$('#grid [aria-pressed]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    $('#p-add').disabled = true;
    $('#p-add').textContent = 'Add';
    closeSheets();
    const files = await Promise.all(chosen.map(async ([name, cols, sun]) => new File([await app().relayPhoto(cols, sun)], name, { type: 'image/jpeg' })));
    app().uploadAll(files);
  });
  web.addEventListener('load', () => {
    doc().querySelector('label[for="picker"]').addEventListener('click', (e) => { e.preventDefault(); openSheet($('#picker')); });
  });
  // the page's "Save to Photos" opens the share sheet
  window.relayShare = async ({ files }) => {
    const pick = await actionSheet(files?.[0]?.name || '', [{ label: files?.[0]?.type.startsWith('video/') ? 'Save Video' : 'Save Image' }, { label: 'Save to Files' }]);
    if (pick) hud(pick === 'Save to Files' ? 'Saved to Files' : 'Saved to Photos');
  };

  // guided tour
  onTour(() => [
    { tap: () => doc().querySelector('label[for="picker"]'), say: 'Send photos to the laptop', after: 900 },
    { tap: '#grid [data-p="0"]', after: 250 },
    { tap: '#grid [data-p="4"]', after: 250 },
    { tap: '#grid [data-p="8"]', after: 400 },
    { tap: '#p-add', say: 'They arrive on the laptop straight away', after: 3200 },
    { tap: () => [...doc().querySelectorAll('.actions .primary')].find((b) => b.textContent.includes('Save')), say: 'Save a file straight to Photos', after: 900 },
    { tap: () => $$('.actions button').find((b) => b.textContent.startsWith('Save Image')), after: 1700 },
    { say: 'Your turn: send something', wait: 1500 },
  ]);
</script>
</body>
</html>
