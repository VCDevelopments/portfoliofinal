<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VCDevelopments on iPhone · demo</title>
  <!-- The real site, vcdevelopments.info, as an iPhone shows it in Safari. -->
  <link rel="stylesheet" href="../ios.css" />
  <link rel="stylesheet" href="../safari.css" />
  <style>
    :root { --page: #9a9ea6; }
    .screen { background: var(--page); --sb: #fff; }
  </style>
</head>
<body>
<div class="screen">
  <div class="topfill"></div>
  <iframe class="webview" id="web" src="../../?embed" title="vcdevelopments.info"></iframe>
  <div class="safari">
    <div class="addr"><span class="aa">aA</span><span class="url"><svg viewBox="0 0 10 13"><rect x="0.5" y="5.5" width="9" height="7" rx="1.5" fill="currentColor"/><path d="M2.5 6V4a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>vcdevelopments.info</span><button type="button" id="reload" aria-label="Reload"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="tools">
      <button type="button" disabled aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" disabled aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M8 10H6v11h12V10h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Bookmarks"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.6-4.6-2-8-2v14c3.4 0 6 .4 8 2 2-1.6 4.6-2 8-2V4c-3.4 0-6 .4-8 2zm0 0v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <button type="button" aria-label="Tabs"><svg viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 4.5h10.5a2.5 2.5 0 0 1 2.5 2.5v10.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
  </div>
</div>
<script type="module">
  import { $, chrome, onTour, wait } from '../ios.js';
  chrome();
  const web = $('#web');
  const win = () => web.contentWindow, doc = () => web.contentDocument;
  $('#reload').addEventListener('click', () => win().location.reload());
  // scroll the site to a fraction of its length (its scenes follow the scroll)
  const to = (f) => () => (doc().scrollingElement.scrollHeight - win().innerHeight) * f;
  // a tap on the scene where the finger is: the site reads pointer moves and presses
  const tapScene = (fx, fy) => async () => {
    const x = win().innerWidth * fx, y = win().innerHeight * fy, c = doc().getElementById('gl');
    for (const type of ['pointermove', 'pointerdown', 'pointerup']) c.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, pointerType: 'touch', isPrimary: true }));
  };

  onTour(() => [
    { run: async () => { while (doc().body.classList.contains('is-loading') || doc().body.classList.contains('is-intro')) await wait(200); }, after: 300 },
    { at: () => doc().getElementById('gl'), run: tapScene(0.5, 0.5), say: 'Tap the neon logo', after: 2200 },
    { tap: () => doc().querySelector('.lights'), say: 'Night mode', after: 1600 },
    { scroll: () => doc().scrollingElement, to: to(0.22), say: 'Scroll through the projects', after: 2400 },
    { scroll: () => doc().scrollingElement, to: to(0.45), after: 2200 },
    { scroll: () => doc().scrollingElement, to: to(0.68), say: 'What I build, and how', after: 2400 },
    { scroll: () => doc().scrollingElement, to: to(1), say: 'And get in touch', after: 2400 },
    { tap: () => doc().querySelector('.lang'), say: 'In English or Dutch', after: 1800 },
    { tap: () => doc().querySelector('.lang'), after: 600 },
  ]);
</script>
</body>
</html>
