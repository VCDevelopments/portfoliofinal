<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Relay: scan to connect</title><link rel="stylesheet" href="_kit.css"></head><body>
<div class="stage" style="background: linear-gradient(135deg, #0B2A2E, #11605F)">
  <div class="head" style="right: 560px"><div class="kicker">Relay · step 1</div><div class="title">Scan once and you're connected</div><div class="sub">The QR code holds the laptop's address and a private key, so the phone is paired in one scan, and stays paired.</div></div>

      <g fill="#0B2A2E"><rect width="7" height="7"/><rect x="1" y="1" width="5" height="5" fill="#fff"/><rect x="2" y="2" width="3" height="3"/><rect x="22" width="7" height="7"/><rect x="23" y="1" width="5" height="5" fill="#fff"/><rect x="24" y="2" width="3" height="3"/><rect y="22" width="7" height="7"/><rect x="1" y="23" width="5" height="5" fill="#fff"/><rect x="2" y="24" width="3" height="3"/>
      <path d="M9 1h2v2H9zM12 0h1v3h-1zM14 2h3v1h-3zM18 0h2v2h-2zM9 5h3v1H9zM15 5h2v3h-2zM19 4h1v3h-1zM9 9h1v4H9zM11 8h3v1h-3zM16 10h2v2h-2zM20 9h3v1h-3zM24 9h2v3h-2zM27 8h2v2h-2zM1 9h3v1H1zM0 12h2v2H0zM4 11h2v3H4zM8 15h2v1H8zM12 12h2v4h-2zM15 14h3v1h-3zM19 13h1v4h-1zM22 14h2v1h-2zM26 13h3v2h-3zM2 16h3v1H2zM6 17h1v3H6zM9 18h3v2H9zM14 17h2v3h-2zM18 19h3v1h-3zM23 17h2v2h-2zM27 18h1v3h-1zM9 22h2v3H9zM12 23h3v1h-3zM16 22h1v4h-1zM18 23h3v2h-3zM22 21h2v1h-2zM25 22h3v1h-3zM10 27h4v1h-4zM15 27h2v2h-2zM19 26h3v1h-3zM23 25h2v3h-2zM26 26h3v1h-3z"/></g>
    </svg>
    <div style="font-size: 18px; font-weight: 500">Scan with your phone</div>
  </div>
  <div class="arrow" style="left: 510px; top: 500px; width: 220px; color: #3DE0C0"></div>
  <div class="mono" style="position: absolute; left: 512px; top: 466px; font-size: 13px; color: #9FF0E4">address + key</div>
  <!-- phone camera scanning -->
  <div class="phone" style="left: 760px; top: 110px"><div class="screen" style="background: #1B2224"><div class="island"></div>

    <div style="position: absolute; left: 76px; top: 202px; width: 126px; height: 126px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.75) 0 6px, transparent 6px 12px), repeating-linear-gradient(0deg, rgba(255,255,255,0.6) 0 6px, transparent 6px 14px); opacity: 0.55; border-radius: 6px"></div>
    <div style="position: absolute; left: 20px; right: 20px; top: 380px; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.92); color: #0B2A2E; font-size: 15px; line-height: 1.35"><b>Open “Relay”</b><br><span class="mono" style="font-size: 12px; color: #3F5A5C">192.168.1.24:8443/?key=••••••</span></div>
  </div></div>
